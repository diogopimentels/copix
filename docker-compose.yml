services:
  postgres:
    image: postgres:16-alpine
    container_name: copix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-copix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copix_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-copix_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - copix_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-copix} -d ${POSTGRES_DB:-copix_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: copix-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - copix_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  copix_pg_data:
  copix_redis_data:
