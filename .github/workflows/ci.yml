name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm install

      - name: Lint web
        run: npm run web:lint

      - name: Typecheck web
        run: npm run web:typecheck

      - name: Test web
        run: npm run web:test

      - name: Build web
        run: npm run web:build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: http://localhost:3333
